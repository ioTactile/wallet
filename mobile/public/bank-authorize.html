<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Connexion bancaire</title>
  </head>
  <body>
    <p>Redirection vers la banque…</p>
    <script>
      (function () {
        var url = new URLSearchParams(window.location.search).get('authorizationUrl') || '';
        if (!/^https?:\/\//i.test(url)) {
          document.body.textContent = 'URL de connexion invalide.';
          return;
        }
        // Top-level navigation only — banks forbid embedding (X-Frame-Options / CSP).
        window.location.replace(url);
      })();
    </script>
  </body>
</html>
